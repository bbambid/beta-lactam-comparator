<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小児処方監査CDS</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.w{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ec;border-radius:16px;padding:16px;margin-bottom:10px}.title{font-size:23px;font-weight:900}.sub{font-size:11px;line-height:1.7;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}label{display:block;font-size:9px;font-weight:900;color:#667085;margin-bottom:4px}input,select{width:100%;padding:9px;border:1px solid #d6dee8;border-radius:8px;background:#fff}.out{margin-top:10px;padding:11px;background:#f8fafc;border:1px solid #e3e9ef;border-radius:10px;font-size:11px;line-height:1.65}.tag{display:inline-block;padding:3px 6px;border-radius:999px;background:#eef4fb;font-size:9px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><section class="card"><span class="tag">prototype v1</span><div class="title">小児処方監査CDS</div><div class="sub">薬剤ごとに「添付文書・GL等に小児用量あり」を最優先。明確な設定がない薬だけ成人量換算を参考表示し、換算値だけで適否判定しません。</div></section><section class="card"><div class="grid"><div><label>薬剤</label><select id="drug"><option value="cam">クラリスロマイシンDS10%</option><option value="generic">小児用量設定なしの薬（試作）</option></select></div><div><label>年齢（歳）</label><input id="age" type="number" min="0" step=".1" value="5"></div><div><label>体重 kg</label><input id="wt" type="number" min="0" step=".1" value="18"></div><div><label>処方1日量 mg</label><input id="dose" type="number" min="0" step=".1" value="270"></div><div><label>分割</label><select id="freq"><option value="2">分2</option><option value="3">分3</option></select></div><div id="adultWrap" style="display:none"><label>成人1日量 mg</label><input id="adult" type="number" min="0" step=".1" value="1500"></div></div><div id="out" class="out"></div></section><section class="card"><b>設計ルール</b><div class="sub">①薬剤固有の小児用量 → ②年齢/体重/適応別の承認用量 → ③成書・GL → ④それでも設定がなければAugsberger・von Harnack・Young・Clark・BSA等を「参考値」として並列表示。<br>分2/分3は「1日量」と「1回量」を分離して監査し、医師の分割慣行を理由に勝手に1日量を2/3へ補正しません。将来、薬剤ごとに分割回数の根拠をDB化します。</div></section></main><script>const $=x=>document.getElementById(x);function vh(a){if(a<.08)return .125;if(a<.75)return .2;if(a<2)return .25;if(a<5)return 1/3;if(a<10)return .5;if(a<15)return 2/3;return 1}function r(){const d=$("drug").value,a=+$("age").value,w=+$("wt").value,x=+$("dose").value,f=+$("freq").value;$("adultWrap").style.display=d==="generic"?"block":"none";let h="<b>処方監査</b><br>処方："+x+" mg/day（"+(x/w).toFixed(1)+" mg/kg/day）、1回 "+(x/f).toFixed(1)+" mg × "+f+"回。";if(d==="cam"){h+="<br><b>薬剤固有用量あり：</b>成人量換算式より、クラリスロマイシンの小児用法・用量を優先して照合する設計。分2処方も『1日量を勝手に3分の2へ補正』せず、まず総mg/kg/dayと承認された分割法を別々に評価します。";}else{const ad=+$("adult").value,aug=ad*(4*a+12)/100,young=ad*a/(a+12),clark=ad*w/68;h+="<br><b>明確な小児用量なし：</b>参考推定のみ。Augsberger-II "+aug.toFixed(0)+" mg/day、Young "+young.toFixed(0)+"、Clark "+clark.toFixed(0)+"、von Harnack "+(ad*vh(a)).toFixed(0)+"。これらの乖離だけで疑義判定しません。";}$("out").innerHTML=h}["drug","age","wt","dose","freq","adult"].forEach(i=>$(i).oninput=r);r();</script></body></html>
