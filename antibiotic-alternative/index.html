<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAM代替提案CDS preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.w{max-width:940px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dfe6ec;border-radius:16px;padding:16px;margin-bottom:10px}.title{font-size:21px;font-weight:900}.sub{font-size:11px;color:#667085;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}label{display:block;font-size:9px;font-weight:900;color:#667085;margin-bottom:4px}select{width:100%;padding:9px;border:1px solid #d6dee8;border-radius:8px;background:#fff}.out{margin-top:10px;padding:12px;border:1px solid #dce5ed;border-radius:11px;background:#f8fafc;font-size:11px;line-height:1.7}.ok,.hold,.ng{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.ok{background:#eaf6ee;color:#27623b}.hold{background:#fff7e6;color:#7a5a12}.ng{background:#fff0ed;color:#9b3d31}.row{padding:9px;margin-top:8px;border-radius:9px;background:#fff;border:1px solid #e3e9ef}.mini{font-size:9px;color:#667085}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef4fb;font-size:9px;font-weight:900}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="w"><section class="card"><span class="tag">interaction DB preview</span><div class="title">CAM併用禁忌 → RXM代替評価</div><div class="sub">慢性副鼻腔炎の少量長期マクロライド療法を想定。「CAM側」「RXM側」「併用薬側」を別々に記録し、3方向の確認状態に応じて判定します。未確認を勝手に「安全」へ昇格させません。</div></section>
<section class="card"><div class="grid"><div><label>CAMが使えない原因薬</label><select id="drug">
<option value="suv">スボレキサント</option><option value="aze">アゼルニジピン</option><option value="ergot">エルゴタミン／ジヒドロエルゴタミン</option><option value="pim">ピモジド</option><option value="war">ワルファリン（併用注意ケース）</option></select></div>
<div><label>治療目的</label><select id="purpose"><option>慢性副鼻腔炎｜少量長期マクロライド療法</option></select></div></div><div id="out" class="out"></div></section>
<section class="card"><b>今回入れた初期データ</b><div class="sub">まず薬局で遭遇しうる代表例を少数ずつ。相互作用DBはこの形式で追加していきます。</div><div id="list"></div></section></main>
<script>
const DB={
suv:{name:"スボレキサント",cam:"併用禁忌：血中濃度が顕著に上昇し作用増強のおそれ",rxm:"RXM電子添文の併用禁忌には列挙なし",co:"併用薬側の最新電子添文を最終照合して確定",state:"hold",label:"条件付き候補",memo:"RXMへ機械的に置換せず、ベルソムラ側の最新相互作用記載まで確認してから提案。"},
aze:{name:"アゼルニジピン",cam:"2026年3月改訂でCAMとの併用禁忌",rxm:"RXM電子添文の併用禁忌には列挙なし",co:"アゼルニジピン側の最新電子添文を最終照合して確定",state:"hold",label:"優先検証",memo:"CAM回避という目的は明確。RXM側だけで安全確定しない。"},
ergot:{name:"エルゴタミン／ジヒドロエルゴタミン",cam:"CAMで併用禁忌：血管攣縮等の重篤な副作用のおそれ",rxm:"RXMでも併用禁忌",co:"代替候補評価不要",state:"ng",label:"RXMでは回避不可",memo:"CAM→RXM置換は相互作用回避にならない。"},
pim:{name:"ピモジド",cam:"CAMで併用禁忌：QT延長・心室性不整脈",rxm:"RXMはQT延長を起こすおそれがあり、QT延長薬は併用注意",co:"ピモジド側を含め個別評価",state:"ng",label:"RXMを自動提案しない",memo:"元の問題がQT/不整脈なので、同じリスク軸を持つRXMへの単純置換は避ける。"},
war:{name:"ワルファリン",cam:"CAMでは併用注意として抗凝固作用増強に注意",rxm:"RXMでもワルファリン作用増強の併用注意",co:"INR等を含む臨床管理が必要",state:"ng",label:"単純置換で解決しない",memo:"禁忌回避ではなく相互作用管理の問題。RXMへ替えるだけで問題消失とはしない。"}
};
const $=x=>document.getElementById(x);
function badge(x){return '<span class="'+x.state+'">'+x.label+'</span>'}
function render(){const x=DB[$("drug").value];$("out").innerHTML='<b>'+x.name+'</b> '+badge(x)+'<div class="row"><b>① CAM側</b><br>'+x.cam+'</div><div class="row"><b>② RXM側</b><br>'+x.rxm+'</div><div class="row"><b>③ 併用薬側</b><br>'+x.co+'</div><div class="row"><b>CDS判断</b><br>'+x.memo+'</div><div class="mini">治療目的が慢性副鼻腔炎の少量長期療法であることを前提。RXMの通常承認用量は成人300 mg/dayであり、少量長期療法の用量は別途エビデンスを明示して扱う。</div>'}
$("drug").onchange=render;render();
$("list").innerHTML=Object.values(DB).map(x=>'<div class="row"><b>'+x.name+'</b> '+badge(x)+'<br><span class="mini">'+x.memo+'</span></div>').join("");
</script></body></html>
